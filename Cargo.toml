[package]
name = "tracing-cloudrun"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
doctest = false

[dependencies]
http = "1.3.1"
tower = "0.5.2"
tower-http = { version = "0.6.1", features = ["trace"] }

google-cloud-metadata = "0.5.1"

opentelemetry = "0.31.0"
opentelemetry-http = "0.31.0"
opentelemetry_sdk =  { version = "0.31.0", features = ["trace"] }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.32.0"
tracing-stackdriver = {git = "https://github.com/send-ai/tracing-stackdriver.git", tag = "v0.11.0",  version = "0.11.0", features = ["opentelemetry"] }
